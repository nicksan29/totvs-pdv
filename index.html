<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOTVS - SmartPOS</title>
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <header class="app-header">
    <div class="header-container">
      <div class="logo-group">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#004d99" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>

        <div>
          <h1><span>SmartPOS</span></h1>
          <p>Terminal de Vendas Simplificado</p>
        </div>
      </div>
      <button id="mobile-cart-btn" class="mobile-cart-btn" aria-label="Abrir carrinho">
        🛒 <span id="cart-count-badge">0</span> itens
      </button>
    </div>
  </header>

  <main class="app-layout">
    <product-grid class="products-section"></product-grid>

    <cart-summary class="cart-section"></cart-summary>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <div class="footer-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>SmartPOS</span>
      </div>
      <p>&copy; 2024 TOTVS S.A. Todos os direitos reservados.</p>
    </div>
  </footer>



  <script type="module" src="src/main.js"></script>
</body>

</html>
